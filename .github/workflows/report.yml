name: report
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: report
  cancel-in-progress: false
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and send report (no AI, pure script)
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          OLD_DAY=$(python3 -c "import json;print(json.load(open('state.json')).get('keepalive_day',''))" 2>/dev/null || true)
          OLD_IDS=$(python3 -c "import json;print(json.load(open('state.json')).get('chat_ids',[]))" 2>/dev/null || true)
          python3 bot.py
          NEW_DAY=$(python3 -c "import json;print(json.load(open('state.json')).get('keepalive_day',''))")
          NEW_IDS=$(python3 -c "import json;print(json.load(open('state.json')).get('chat_ids',[]))")
          # commit state only when chat ids change or once per day (keeps the scheduled workflow from being auto-disabled)
          if [ "$OLD_DAY" != "$NEW_DAY" ] || [ "$OLD_IDS" != "$NEW_IDS" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "state: keepalive $NEW_DAY" || true
            git pull --rebase -X theirs || true
            git push || true
          fi
